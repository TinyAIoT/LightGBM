# regression , regression task
# binary , binary classification task
# lambdarank , LambdaRank task
# alias: application, app
objective = binary


# binary_error

metric = auc, binary_logloss, rmse, l1, l2, mape, huber
max_bin = 255
train_data = data/covtype.libsvm.binary.train
