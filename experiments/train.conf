# task type, support train and predict
task = train

# boosting type, support gbdt for now, alias: boosting, boost
boosting_type = gbdt

objective = binary

metric = auc, binary_logloss, rmse, l1, l2, mape, huber
max_bin = 255
train_data = data/covtype.libsvm.binary.train
valid_data = data/covtype.libsvm.binary.test
num_threads = 1
max_bin = 255

# shrinkage rate , alias: shrinkage_rate
learning_rate = 0.1
# number of leaves for one tree, alias: num_leaf
num_leaves = 255
max_depth = 3
tree_learner = serial
num_parallel_tree = 1

# minimal number data for one leaf, use this to deal with over-fit
# alias : min_data_per_leaf, min_data
min_data_in_leaf = 10

#/*[tinygbdt] BEGIN: Declaring hyperparameter */
tinygbdt_penalty_feature = 0.8
tinygbdt_penalty_split = 0.9
tinygbdt_precision = 1
tinygbdt_forestsize = 50000
#/*[tinygbdt] END */

seed = 42