# task type, support train and predict
task = train

# boosting type, support gbdt for now, alias: boosting, boost
boosting_type = gbdt

# application type, support following application
# regression , regression task
# binary , binary classification task
# lambdarank , LambdaRank task
# alias: application, app
objective = binary


# binary_error
metric = auc, binary_logloss, rmse, l1, l2, mape, huber
max_bin = 255
train_data = covtype.libsvm.binary
valid_data = covtype.libsvm.binary.test
# shrinkage rate , alias: shrinkage_rate
learning_rate = 0.1
# number of leaves for one tree, alias: num_leaf
num_leaves = 255
max_depth = 3
tree_learner = serial
num_parallel_tree = 1
# number of threads for multi-threading. One thread will use each CPU. The default is the CPU count.
num_threads = 1
min_data_in_leaf = 10
#/*[tinygbdt] BEGIN: Declaring hyperparameter */
tinygbdt_penalty_feature = 0.8
tinygbdt_penalty_split = 0.9
tinygbdt_precision = 1
tinygbdt_forestsize = 50000
#/*[tinygbdt] END */

# verbosity = 2

seed = 42