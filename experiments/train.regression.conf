# task type, support train and predict
task = train

# boosting type, support gbdt for now, alias: boosting, boost
boosting_type = gbdt

# application type, support following application
objective = regression

# eval metrics, support multi metric, delimited by ',' , support following metrics
metric = rmse

# number of bins for feature bucket, 255 is a recommend setting, it can save memories, and also has good accuracy.
max_bin = 255

# training data
train_data = 'data/california_housing.libsvm.train'

# validation data, support multi validation data, separated by ','
valid_data = 'data/california_housing.libsvm.test'

# shrinkage rate , alias: shrinkage_rate
learning_rate = 0.1

# number of leaves for one tree, alias: num_leaf
num_leaves = 255

max_depth = 3

# type of tree learner
tree_learner = serial
num_parallel_tree = 1

# minimal number data for one leaf, use this to deal with over-fit
min_data_in_leaf = 10

#/*[tinygbdt] BEGIN: Declaring hyperparameter */
toad_penalty_feature = 0
toad_penalty_threshold = 0
toad_forestsize = 500000
#/*[tinygbdt] END */

verbosity = 2

seed = 42